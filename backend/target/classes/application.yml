spring:
  application:
    name: room911-management-system
  
  # JPA / Hibernate
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      "[hibernate.dialect]": org.hibernate.dialect.PostgreSQLDialect
      "[hibernate.format_sql]": true
  
  # DataSource PostgreSQL
  datasource:
    url: jdbc:postgresql://localhost:5432/room_911
    username: postgres
    password: Room911123*
    driver-class-name: org.postgresql.Driver

# Server Configuration
server:
  port: 8080
  servlet:
    context-path: /api

# Logging
logging:
  level:
    root: INFO
    "[com.room911]": DEBUG
    "[org.springframework.web]": DEBUG
    "[org.hibernate.SQL]": DEBUG
